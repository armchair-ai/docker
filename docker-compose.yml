services:

    nginx:
        image: nginx:1.31.2-alpine
        container_name: aa-nginx
        restart: always
        ports:
            - 80:80
        volumes:
            - ./..:/var/www
            - ./sites-enabled:/etc/nginx/conf.d
            - ./run:/tmp/run
        networks:
            - default

    python:
        image: aa-python-3-14
        container_name: aa-python
        user: "${UID:-1000}:${GID:-1000}"
        restart: always
        working_dir: /app
        build:
            context: ./python-3-14
            dockerfile: Dockerfile
        environment:
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - HOME=/tmp
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - REDIS_HOST=${REDIS_HOST:-redis}
            - REDIS_PORT=${REDIS_PORT:-6379}
        volumes:
            - ./../back:/app
            - ./../skeleton-laravel-back:/workspace/skeleton-laravel-back
            - /var/run/docker.sock:/var/run/docker.sock 
            - ./run:/tmp/run
            - ./.gemini:/tmp/.gemini
        command: sh -c "uvicorn app.main:app --uds /tmp/run/uvicorn.sock --reload 2>&1 | tee /app/uvicorn.log"

    worker:
        image: aa-python-3-14
        container_name: aa-worker
        user: "${UID:-1000}:${GID:-1000}"
        restart: always
        working_dir: /app
        environment:
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - HOME=/tmp
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - REDIS_HOST=${REDIS_HOST:-redis}
            - REDIS_PORT=${REDIS_PORT:-6379}
        volumes:
            - ./../back:/app
            - ./../skeleton-laravel-back:/workspace/skeleton-laravel-back
            - /var/run/docker.sock:/var/run/docker.sock
            - ./.gemini:/tmp/.gemini
        command: python -m app.worker

    php:
        image: aa-php-8-4
        container_name: aa-php
        restart: always
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            - HOME=/tmp
        build:
            context: ./php-8-4
            dockerfile: Dockerfile
        working_dir: /var/www
        volumes:
            - ./../skeleton-laravel-back:/var/www
            - ./php-config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    
    db:
        image: postgres:18.4-alpine
        container_name: aa-db
        restart: always
        ports: 
            - 5432:5432
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - ./../databases:/var/lib/postgresql

    angular:
        image: angular:22.1.6
        container_name: aa-angular
        restart: always
        working_dir: /srv
        build:
            context: ./angular-22-1-6
            dockerfile: Dockerfile
        volumes:
            - ./../front:/srv
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            - HOME=/tmp
            - NG_CLI_ANALYTICS=false
        command: ng serve --host 0.0.0.0 --port 4200 --poll 2000
        ports: 
            - 4200:4200

    redis:
        image: redis:7.4-alpine
        container_name: aa-redis
        restart: always
        ports:
            - 6379:6379
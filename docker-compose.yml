services:

    nginx:
            image: nginx:1.31.2-alpine
            container_name: aa-nginx
            restart: always
            ports:
                - 80:80
            volumes:
                - ./..:/var/www
                - ./sites-enabled:/etc/nginx/conf.d
                - ./run:/tmp/run
            networks:
                - default

    python:
        image: aa-python-3-14
        container_name: aa-python
        restart: always
        working_dir: /app
        build:
            context: ./python-3-14
            dockerfile: Dockerfile
        environment:
            - GEMINI_API_KEY=${GEMINI_API_KEY}
        volumes:
            - ./../armchair-ai-back:/app
            - ./run:/tmp/run
            - ./.gemini:/root/.gemini
        command: sh -c "uvicorn app.main:app --uds /tmp/run/uvicorn.sock --reload 2>&1 | tee /app/uvicorn.log"